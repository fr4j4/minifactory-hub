# Producción simple: la aplicación + Postgres. Respalde el volumen `files` y la base (pg_dump) o use Configuración → Respaldo.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: minifactory, POSTGRES_PASSWORD: minifactory, POSTGRES_DB: minifactory }
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  app:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://minifactory:minifactory@db:5432/minifactory
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET}
      STORAGE_DIR: /data/storage
      DATA_DIR: /data
      ORCA_CONCURRENCY: 2
    volumes: [files:/data]
    ports: ["3000:3000"]
    restart: unless-stopped
volumes: { pgdata: {}, files: {} }
