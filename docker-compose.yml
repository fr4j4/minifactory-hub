# Producción simple: la aplicación + Postgres. Respalde el volumen `files` y la base (pg_dump) o use Configuración → Respaldo.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: minifactory, POSTGRES_PASSWORD: minifactory, POSTGRES_DB: minifactory }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    restart: unless-stopped
  app:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://minifactory:minifactory@127.0.0.1:5432/minifactory
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET}
      SESSION_SECRET_PREVIOUS: ${SESSION_SECRET_PREVIOUS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@minifactory.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STORAGE_DIR: /data/storage
      DATA_DIR: /data
      ORCA_CONCURRENCY: 2
      MF_EXTERNAL_WORKER: "1" # la web solo encola; el servicio `worker` ejecuta los laminados
    volumes: [files:/data]
    # Modo host: el contenedor ve la red local para detectar impresoras Bambu Lab por SSDP.
    network_mode: host
    restart: unless-stopped
  worker:
    build: .
    depends_on: [db]
    command: ["npx", "tsx", "scripts/worker.ts"]
    environment:
      DATABASE_URL: postgres://minifactory:minifactory@127.0.0.1:5432/minifactory
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET}
      SESSION_SECRET_PREVIOUS: ${SESSION_SECRET_PREVIOUS:-}
      STORAGE_DIR: /data/storage
      DATA_DIR: /data
      ORCA_CONCURRENCY: 2
      MF_EXTERNAL_WORKER: "1"
    volumes: [files:/data]
    network_mode: host
    restart: unless-stopped
volumes: { pgdata: {}, files: {} }
